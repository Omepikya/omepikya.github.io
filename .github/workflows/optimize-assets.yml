name: Optimize website assets

on:
  push:
    branches: [main]
    paths:
      - "assets/app-gallery/*.jpg"
      - "assets/omepikya-share.svg"
      - ".github/workflows/optimize-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp librsvg2-bin
      - name: Generate responsive WebP gallery assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for src in assets/app-gallery/*.jpg; do
            base="${src%.jpg}"
            cwebp -quiet -q 82 -resize 225 0 "$src" -o "${base}-225.webp"
            cwebp -quiet -q 82 -resize 450 0 "$src" -o "${base}-450.webp"
            cwebp -quiet -q 82 -resize 900 0 "$src" -o "${base}-900.webp"
          done
      - name: Generate PNG social preview
        run: rsvg-convert -w 1200 -h 630 assets/omepikya-share.svg -o assets/omepikya-share.png
      - name: Commit generated assets
        run: |
          if git diff --quiet -- assets/app-gallery assets/omepikya-share.png; then
            echo "No generated asset changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app-gallery assets/omepikya-share.png
          git commit -m "Optimize gallery and social preview assets"
          git push
