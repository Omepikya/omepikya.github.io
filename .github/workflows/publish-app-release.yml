name: Publish App Release

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-app-release.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish v1.1.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.1.1 already exists; nothing to publish."
          else
            gh release create v1.1.1 \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title "Omepikya Expense v1.1.1" \
              --notes "Omepikya Expense v1.1.1\n\n- Updated receipt OCR amount detection\n- Improved handling of rupee glyph OCR errors\n- Latest production Android build\n\nThe production APK is maintained in the OmepikyaExpense repository."
          fi
